name: Meeting Notes APK

on:
  push:
    paths:
      - "meeting-notes/**"
      - ".github/workflows/meeting-notes-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-notes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meeting-notes-apk
          path: meeting-notes/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
